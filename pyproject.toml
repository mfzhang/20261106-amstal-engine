[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "amstal-engine"
version = "1.3.0"
description = "Amstal: Multi-Modal Quantitative Alpha & Risk Engine (QARE-MM v1.3)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Amstal Quant Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "polars>=1.0.0",
    "duckdb>=1.0.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "lightgbm>=4.0.0",
    "pydantic>=2.0.0",
    "websockets>=12.0",
    "yfinance>=0.2.30",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]
neural = [
    "torch>=2.2.0",
    "torch-geometric>=2.5.0",
    "hmmlearn>=0.3.0",
]
altdata = [
    "edgartools>=2.0.0",
    "transformers>=4.35.0",
]
all = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "torch>=2.2.0",
    "torch-geometric>=2.5.0",
    "hmmlearn>=0.3.0",
    "edgartools>=2.0.0",
    "transformers>=4.35.0",
]

[project.scripts]
amstal-engine = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
